# Tuned for macOS and Linux clients. Windows works too, since vfs_fruit only
# engages for clients that negotiate the Apple extensions, but for a Windows
# first-class setup add Thumbs.db and desktop.ini to veto files, and lower
# server min protocol for anything older than Windows 8.

[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = AI Workspace

   # macOS and Linux only, so there is no Windows compatibility floor to hold
   # and no reason to allow anything below SMB3 or to leave traffic in clear.
   server min protocol = SMB3_00
   client min protocol = SMB3_00
   server smb encrypt = required

   map to guest = never
   restrict anonymous = 2
   disable netbios = yes
   smb ports = 445

   # Required by streams_xattr, and recommended alongside vfs_fruit.
   ea support = yes
   unix extensions = no

   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   logging = stdout
   log level = 1
   max log size = 0

   private dir = /var/lib/samba/private
   state directory = /var/lib/samba
   cache directory = /var/lib/samba
   pid directory = /run/samba

[workspace]
   path = /workspace
   browseable = yes
   read only = no
   valid users = claude
   force user = claude
   force group = claude

   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775

   # Order matters: catia, then fruit, then streams_xattr.
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes
   fruit:nfs_aces = no

   # The claude-remote container writes this same tree without going through
   # Samba, so Samba cannot see those writes and cannot break a lease it has
   # handed out. Any client-side caching is therefore unsafe. Disabling
   # oplocks alone is not enough: modern macOS uses SMB2 leases.
   oplocks = no
   level2 oplocks = no
   kernel oplocks = no
   smb2 leases = no
   strict locking = no

   # Everything in this tree gets committed by the backup job, so keep macOS
   # scratch files out of it entirely. Safe only because fruit:metadata=stream
   # means AppleDouble files are never created - if that changes, so must this.
   veto files = /.DS_Store/._*/.Spotlight-V100/.Trashes/.TemporaryItems/.fseventsd/
   delete veto files = yes
