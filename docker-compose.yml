# Every host path this stack owns lives under AIWR_ROOT, so there is one
# directory to create, chown and lock down, and one value to change to point a
# whole stack at a different tree:
#
#   ${AIWR_ROOT}/workspace  the git repo, mounted at /workspace everywhere
#   ${AIWR_ROOT}/home       Claude's config dir, mounted at /config
#
# The backup itself is not under that root. BACKUP_MOUNT names a directory on
# storage the OS has mounted, and it arrives at /backup in the backup container.

x-env: &env
  WORKSPACE_UID: ${WORKSPACE_UID:-1000}
  WORKSPACE_GID: ${WORKSPACE_GID:-1000}
  TZ: ${TZ:-UTC}

services:

  claude-remote:
    # No build args. The uid is applied at startup, not baked in, so changing
    # it in .env needs a recreate like every other setting and never a rebuild.
    build: ./claude
    image: ai-workspace-remote-claude
    container_name: ai-workspace-claude
    restart: unless-stopped

    # The device name in claude.ai. Claude Code registers with os.hostname()
    # and nothing else overrides it. Unset gives you the container ID.
    # Changing it needs a recreate, not a restart.
    hostname: ${CLAUDE_HOSTNAME:-ai-workspace}

    # tini as PID 1, so SIGTERM is not discarded and a stop does not wait out
    # the grace period and SIGKILL mid-transcript.
    init: true
    tty: true
    stdin_open: true

    volumes:
      - ${AIWR_ROOT:?}/workspace:/workspace
      # One directory, via CLAUDE_CONFIG_DIR below. Not $HOME: mounting over
      # the home would hide /home/claude/.local, where Claude and uv are
      # installed. Not two separate mounts either, because .claude.json is
      # rewritten by rename and a single-file bind mount cannot be replaced,
      # so anything Claude recorded there was silently lost on restart.
      - ${AIWR_ROOT:?}/home:/config

    # CMD in the image hardcodes the mode; overriding it here is what makes
    # CLAUDE_PERMISSION_MODE a real setting rather than a decorative one.
    #
    # --spawn is not optional. Without it remote-control asks which spawn mode
    # to use and blocks on stdin, and the service has a terminal with nobody
    # attached, so it waits there forever with no error and no connection.
    command: ["claude", "remote-control", "--spawn=same-dir", "--permission-mode", "${CLAUDE_PERMISSION_MODE:-auto}"]

    environment:
      <<: *env
      # Moves settings.json, plugins/ and .claude.json into one directory we
      # can mount as a directory. Everything Claude persists then survives.
      CLAUDE_CONFIG_DIR: /config
      PLUGIN_NAME: ${PLUGIN_NAME:-}
      PLUGIN_REPO: ${PLUGIN_REPO:-}
      PLUGIN_REF: ${PLUGIN_REF:-}

  samba:
    build: ./samba
    image: ai-workspace-remote-samba
    container_name: ai-workspace-samba
    restart: unless-stopped
    init: true
    ports:
      - "${SMB_BIND_IP:-0.0.0.0}:445:445"
    volumes:
      - ${AIWR_ROOT:?}/workspace:/workspace
    # Rebuilt from the environment every boot, so no stale credential file.
    tmpfs:
      - /var/lib/samba
      - /run/samba
    environment:
      <<: *env
    # Mounted at /run/secrets/smb_password, so it stays out of the
    # environment and out of `docker inspect`.
    secrets:
      - smb_password

  backup:
    build: ./backup
    image: ai-workspace-remote-backup
    container_name: ai-workspace-backup
    restart: unless-stopped
    init: true
    # Runs as the workspace owner, so nothing it writes into .git is
    # root-owned and unwritable by Claude afterwards.
    user: "${WORKSPACE_UID:-1000}:${WORKSPACE_GID:-1000}"
    stop_grace_period: 60s
    volumes:
      - ${AIWR_ROOT:?}/workspace:/workspace
      - ${BACKUP_MOUNT:?}:/backup
      # Only .claude, not the whole home, so .claude.json is not merely
      # excluded from the transcript filter but absent from this container.
      - ${AIWR_ROOT:?}/home:/claude-home:ro
    tmpfs:
      - /tmp:mode=1777
    environment:
      <<: *env
      BACKUP_COMMIT_CRON: ${BACKUP_COMMIT_CRON:-7 * * * *}
    # A silent 3am failure otherwise goes unnoticed.
    healthcheck:
      test: ["CMD", "/opt/aiwr/healthcheck.sh"]
      interval: 300s
      start_period: 120s

secrets:
  smb_password:
    file: ./secrets/smb_password
